<div
  class="modal-overlay"
  *ngIf="isOpen"
>

  <div class="modal-container">

    <div class="modal-header">

      <span class="modal-icon">
        {{ getIcon() }}
      </span>

      <h2>
        {{ title }}
      </h2>

    </div>

    <div class="modal-body">

      <p>
        {{ message }}
      </p>

    </div>

    <div class="modal-actions">

      <button
        class="btn-cancel"
        (click)="onClose()"
      >
        {{ cancelText }}
      </button>

      <button
        class="btn-confirm"
        [ngClass]="type"
        (click)="onConfirm()"
      >
        {{ confirmText }}
      </button>

    </div>

  </div>

</div>
