<div class="perfil-chofer">
  <header class="page-header">
    <h1>Mi Perfil</h1>
    <p class="subtitle">Actualiza tu información personal</p>
  </header>

  <div *ngIf="loading" class="loading-state">
    <div class="spinner"></div>
    <p>Cargando perfil...</p>
  </div>

  <div *ngIf="error" class="alert alert-error">
    {{ error }}
  </div>

  <div *ngIf="success" class="alert alert-success">
    {{ success }}
  </div>

  <div *ngIf="!loading" class="perfil-form">
    <form (ngSubmit)="guardarPerfil()">
      <div class="form-group">
        <label for="nombre">Nombre Completo</label>
        <input
          type="text"
          id="nombre"
          [(ngModel)]="perfil.nombre"
          name="nombre"
          class="form-control"
          required
        />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="perfil.email"
          name="email"
          class="form-control"
          required
        />
      </div>

      <div class="form-group">
        <label for="telefono">Teléfono</label>
        <input
          type="tel"
          id="telefono"
          [(ngModel)]="perfil.telefono"
          name="telefono"
          class="form-control"
        />
      </div>

      <div class="form-group">
        <label for="direccion">Dirección</label>
        <input
          type="text"
          id="direccion"
          [(ngModel)]="perfil.direccion"
          name="direccion"
          class="form-control"
        />
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" [disabled]="loading">
          💾 Guardar Cambios
        </button>
      </div>
    </form>
  </div>
</div>
