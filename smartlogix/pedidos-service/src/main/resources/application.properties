server.port=8082
server.address=0.0.0.0

# DATABASE
spring.datasource.url=jdbc:postgresql://postgres:5432/pedidos_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.flyway.encoding=UTF-8

# KAFKA
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# AUTH0
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://${AUTH0_DOMAIN}/
spring.security.oauth2.resourceserver.jwt.audience=${AUTH0_AUDIENCE}

# OAUTH2 M2M CLIENT
spring.security.oauth2.client.registration.auth0.client-id=${AUTH0_M2M_CLIENT_ID}
spring.security.oauth2.client.registration.auth0.client-secret=${AUTH0_M2M_CLIENT_SECRET}
spring.security.oauth2.client.registration.auth0.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.auth0.scope=ADMIN
spring.security.oauth2.client.provider.auth0.token-uri=https://${AUTH0_DOMAIN}/oauth/token

# ACTUATOR
management.endpoints.web.exposure.include=health,metrics,prometheus,info,circuitbreakers
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# LOGS
logging.level.root=INFO

# OPTIMIZACIONES
spring.main.lazy-initialization=true
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.jmx.enabled=false
