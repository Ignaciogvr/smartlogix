server.port=8083
server.address=0.0.0.0

spring.datasource.url=jdbc:postgresql://postgres:5432/usuarios_db
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# ================= FLYWAY =================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# 🔐 AUTH0
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://${AUTH0_DOMAIN}/
spring.security.oauth2.resourceserver.jwt.audience=${AUTH0_AUDIENCE}

# Auth0 Management API
auth0.domain=${AUTH0_DOMAIN}
auth0.client-id=${AUTH0_M2M_CLIENT_ID}
auth0.client-secret=${AUTH0_M2M_CLIENT_SECRET}

# ================= OPTIMIZACIONES ARRANQUE ================= 
spring.main.lazy-initialization=true

logging.level.root=INFO

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.jmx.enabled=false
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
