# ================= SERVER =================
server.port=8084
server.address=0.0.0.0

# ================= DATABASE =================
spring.datasource.url=jdbc:postgresql://postgres:5432/envio_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ================= JPA =================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ================= FLYWAY =================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ================= KAFKA =================
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=envio-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.type.mapping=com.smartlogix.pedidos.event.PedidoCreadoEvent:com.smartlogix.envio.event.PedidoCreadoEvent,com.smartlogix.pedidos.event.PedidoEstadoActualizadoEvent:com.smartlogix.envio.event.PedidoEstadoActualizadoEvent,com.smartlogix.pedidos.event.PedidoCanceladoEvent:com.smartlogix.envio.event.PedidoCanceladoEvent

# ================= KAFKA RETRY & DLT =================
# Deshabilitar auto-commit para control manual de offset
spring.kafka.consumer.enable-auto-commit=false
# Acknowledge mode: RECORD permite reintentos antes de commitear
spring.kafka.listener.ack-mode=RECORD

# ================= SECURITY (AUTH0) =================
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://${AUTH0_DOMAIN}/
spring.security.oauth2.resourceserver.jwt.audience=${AUTH0_AUDIENCE}

# OAUTH2 M2M CLIENT
spring.security.oauth2.client.registration.auth0.client-id=${AUTH0_M2M_CLIENT_ID}
spring.security.oauth2.client.registration.auth0.client-secret=${AUTH0_M2M_CLIENT_SECRET}
spring.security.oauth2.client.registration.auth0.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.auth0.scope=ADMIN
spring.security.oauth2.client.provider.auth0.token-uri=https://${AUTH0_DOMAIN}/oauth/token

# ================= ACTUATOR =================
management.endpoints.web.exposure.include=health,metrics,prometheus,info
management.endpoint.health.show-details=always

# ================= LOGGING (DEBUG) =================
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web.reactive.function.client.ExchangeFunctions=INFO
logging.level.reactor.netty.http.client=INFO

# ================= OPTIMIZACIONES ARRANQUE ================= 
spring.main.lazy-initialization=true

logging.level.root=INFO

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.jmx.enabled=false
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
